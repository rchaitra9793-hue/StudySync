# Render Blueprint for StudySync
# Render reads this file when you choose "New → Blueprint" and pick this GitHub repo.
services:
  - type: web
    name: studysync
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Dates like "due today" use India time
      - key: TZ
        value: Asia/Kolkata
      # Secret values: Render asks you to type these in when you create the service
      - key: MONGODB_URI
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
